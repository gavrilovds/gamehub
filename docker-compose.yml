services:
  redis-master:
    image: redis:7.4-alpine
    container_name: redis-master
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/master/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-master-data:/data
    networks: [gamehub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-replica-1:
    image: redis:7.4-alpine
    container_name: redis-replica-1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6380:6379"
    volumes:
      - ./redis/replica-1/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-1-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks: [gamehub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis-replica-2:
    image: redis:7.4-alpine
    container_name: redis-replica-2
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6381:6379"
    volumes:
      - ./redis/replica-2/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-replica-2-data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks: [gamehub]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-1:
    image: redis:7.4-alpine
    container_name: sentinel-1
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel-1/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks: [gamehub]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-2:
    image: redis:7.4-alpine
    container_name: sentinel-2
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    ports:
      - "26380:26379"
    volumes:
      - ./redis/sentinel-2/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks: [gamehub]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  sentinel-3:
    image: redis:7.4-alpine
    container_name: sentinel-3
    command: ["sh", "-c", "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    ports:
      - "26381:26379"
    volumes:
      - ./redis/sentinel-3/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks: [gamehub]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  app:
    build:
      context: .
    container_name: gamehub-app
    environment:
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
    ports:
      - "8080:8080"
    depends_on:
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy
    networks: [gamehub]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    profiles: [insight]
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    networks: [gamehub]

networks:
  gamehub:
    driver: bridge

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redis-insight-data:
